name: precompile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build, e.g. v11.0.0'
        required: true
        type: string
      target:
        description: 'Which build to run'
        required: true
        default: macos-x86_64
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
          - macos-universal

permissions:
  contents: write

env:
  QEMU_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    name: setup

    steps:
      - name: Resolve whether this tag holds the latest badge
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "current latest: ${current:-<none>}, rebuilding: ${QEMU_TAG}"
          if [ "${current}" = "${QEMU_TAG}" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    needs: setup
    concurrency:
      group: ${{ github.workflow }}-x86_64-linux-gnu-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-x86_64'
    runs-on: ubuntu-latest
    env:
      HOST_TRIPLET: x86_64-linux-gnu
      DOCKER_PLATFORM: linux/amd64
      DOCKER_IMAGE: ubuntu:22.04
    name: x86_64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile in Docker
        run: |
          export QEMU_VERSION="${QEMU_TAG#v}"
          cp .github/scripts/*.sh ./
          bash ./stage1.sh "${QEMU_VERSION}" "${{ env.HOST_TRIPLET }}" "${{ env.DOCKER_PLATFORM }}" "${{ env.DOCKER_IMAGE }}"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.QEMU_TAG }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          files: |
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256

  linux-aarch64:
    needs: setup
    concurrency:
      group: ${{ github.workflow }}-aarch64-linux-gnu-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-aarch64'
    runs-on: ubuntu-24.04-arm
    env:
      HOST_TRIPLET: aarch64-linux-gnu
      DOCKER_PLATFORM: linux/arm64
      DOCKER_IMAGE: ubuntu:22.04
    name: aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile in Docker
        run: |
          export QEMU_VERSION="${QEMU_TAG#v}"
          cp .github/scripts/*.sh ./
          bash ./stage1.sh "${QEMU_VERSION}" "${{ env.HOST_TRIPLET }}" "${{ env.DOCKER_PLATFORM }}" "${{ env.DOCKER_IMAGE }}"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.QEMU_TAG }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          files: |
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256

  macos-x86_64:
    needs: setup
    concurrency:
      group: ${{ github.workflow }}-x86_64-apple-darwin-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-x86_64'
    runs-on: macos-15-intel
    env:
      HOST_TRIPLET: x86_64-apple-darwin
      XZ_OPT: "-e -T0 -9"
    name: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Install dependencies
        run: |
          brew install \
            cmake ninja meson pkg-config \
            libarchive git gnu-sed automake autoconf coreutils llvm make wget texinfo mercurial libtool \
            glib pixman dtc capstone libsolv samba socat xz \
            gnutls curl libssh libnfs libiscsi \
            libusb usbredir vde \
            sdl2-compat sdl2_image libpng jpeg-turbo ncurses libxkbcommon \
            lzo snappy zstd lzfse \
            bison flex
          
          if [ -f "/usr/local/bin/python3" ]; then
            /usr/local/bin/python3 -m pip install -U --break-system-packages setuptools
          fi
          FIRST_PYTHON3="$(which python3)"
          ${FIRST_PYTHON3} -m pip install -U --break-system-packages setuptools

      - name: Compile Slirp
        run: |
          git clone https://gitlab.freedesktop.org/slirp/libslirp.git
          cd libslirp
          meson setup -Ddefault_library=static build
          ninja -C build install

      - name: Compile QEMU
        run: |
          export QEMU_VERSION="${QEMU_TAG#v}"
          export ROOTDIR="$(pwd)"
          export DESTDIR="${ROOTDIR}/build/qemu-${QEMU_VERSION}"
          rm -rf "${DESTDIR}"
          mkdir -p "${DESTDIR}"
          
          curl -fSL "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" -o "qemu-${QEMU_VERSION}.tar.xz"
          tar -xJf "qemu-${QEMU_VERSION}.tar.xz"
          cd "qemu-${QEMU_VERSION}"
          BREW_PREFIX="$(brew --prefix)"
          export PATH="${BREW_PREFIX}/opt/bison/bin:${BREW_PREFIX}/opt/flex/bin:${PATH}"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/opt/curl/lib/pkgconfig:${BREW_PREFIX}/opt/ncurses/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          bison --version | head -1

          # libnfs is left on auto: qemu <= 10.2 pins it to <6.0.0 and brew ships 16+
          ./configure \
            --prefix=/usr/local \
            --extra-cflags="-I${BREW_PREFIX}/include" \
            --extra-ldflags="-L${BREW_PREFIX}/lib" \
            --disable-xen \
            --enable-strip \
            --enable-modules \
            --enable-user \
            --enable-tools \
            --enable-plugins \
            --enable-tpm \
            --enable-replication \
            --enable-capstone \
            --enable-cocoa \
            --enable-hvf \
            --enable-vmnet \
            --enable-pvg \
            --enable-coreaudio \
            --enable-curses \
            --enable-iconv \
            --enable-sdl \
            --enable-sdl-image \
            --enable-vnc \
            --enable-vnc-jpeg \
            --enable-vnc-sasl \
            --enable-png \
            --enable-xkbcommon \
            --enable-gnutls \
            --enable-curl \
            --enable-libssh \
            --enable-libiscsi \
            --enable-slirp \
            --enable-vde \
            --enable-virtfs \
            --enable-libusb \
            --enable-usb-redir \
            --enable-lzo \
            --enable-snappy \
            --enable-zstd \
            --enable-bzip2 \
            --enable-lzfse
          make -j$(nproc)
          make DESTDIR="${DESTDIR}" install

          cd "${DESTDIR}"
          tar -cJf "${ROOTDIR}/build/qemu-${HOST_TRIPLET}.tar.xz" .
          cd "${ROOTDIR}/build"
          sha256sum qemu-${{ env.HOST_TRIPLET }}.tar.xz | tee qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256

          rm -rf "${DESTDIR}"

      - name: Upload QEMU artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.QEMU_TAG }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          files: |
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256
            build/qemu-static-${{ env.HOST_TRIPLET }}.tar.xz
            build/qemu-static-${{ env.HOST_TRIPLET }}.tar.xz.sha256

  macos-aarch64:
    needs: setup
    concurrency:
      group: ${{ github.workflow }}-aarch64-apple-darwin-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-aarch64'
    runs-on: macos-15
    env:
      HOST_TRIPLET: aarch64-apple-darwin
      XZ_OPT: "-e -T0 -9"
    name: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Install dependencies
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          brew install \
            cmake ninja meson pkg-config \
            libarchive git gnu-sed automake autoconf coreutils llvm make wget texinfo mercurial libtool \
            glib pixman dtc capstone libsolv samba socat xz \
            gnutls curl libssh libnfs libiscsi \
            libusb usbredir vde \
            sdl2-compat sdl2_image libpng jpeg-turbo ncurses libxkbcommon \
            lzo snappy zstd lzfse \
            bison flex

          if [ -f "/usr/local/bin/python3" ]; then
            /usr/local/bin/python3 -m pip install -U --break-system-packages setuptools
          fi
          FIRST_PYTHON3="$(which python3)"
          ${FIRST_PYTHON3} -m pip install -U --break-system-packages setuptools

      - name: Compile Slirp
        run: |
          git clone https://gitlab.freedesktop.org/slirp/libslirp.git
          cd libslirp
          meson setup -Ddefault_library=static build
          ninja -C build install

      - name: Compile QEMU
        run: |
          export QEMU_VERSION="${QEMU_TAG#v}"
          export PATH="/opt/homebrew/bin:$PATH"
          export ROOTDIR="$(pwd)"
          export DESTDIR="${ROOTDIR}/build/qemu-${QEMU_VERSION}"
          rm -rf "${DESTDIR}"
          mkdir -p "${DESTDIR}"
          
          curl -fSL "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" -o "qemu-${QEMU_VERSION}.tar.xz"
          tar -xJf "qemu-${QEMU_VERSION}.tar.xz"
          cd "qemu-${QEMU_VERSION}"
          BREW_PREFIX="$(brew --prefix)"
          export PATH="${BREW_PREFIX}/opt/bison/bin:${BREW_PREFIX}/opt/flex/bin:${PATH}"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/opt/curl/lib/pkgconfig:${BREW_PREFIX}/opt/ncurses/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          bison --version | head -1

          # libnfs is left on auto: qemu <= 10.2 pins it to <6.0.0 and brew ships 16+
          ./configure \
            --prefix=/usr/local \
            --extra-cflags="-I${BREW_PREFIX}/include" \
            --extra-ldflags="-L${BREW_PREFIX}/lib" \
            --disable-xen \
            --enable-strip \
            --enable-modules \
            --enable-user \
            --enable-tools \
            --enable-plugins \
            --enable-tpm \
            --enable-replication \
            --enable-capstone \
            --enable-cocoa \
            --enable-hvf \
            --enable-vmnet \
            --enable-pvg \
            --enable-coreaudio \
            --enable-curses \
            --enable-iconv \
            --enable-sdl \
            --enable-sdl-image \
            --enable-vnc \
            --enable-vnc-jpeg \
            --enable-vnc-sasl \
            --enable-png \
            --enable-xkbcommon \
            --enable-gnutls \
            --enable-curl \
            --enable-libssh \
            --enable-libiscsi \
            --enable-slirp \
            --enable-vde \
            --enable-virtfs \
            --enable-libusb \
            --enable-usb-redir \
            --enable-lzo \
            --enable-snappy \
            --enable-zstd \
            --enable-bzip2 \
            --enable-lzfse
          make -j$(nproc)
          make DESTDIR="${DESTDIR}" install
          
          cd "${DESTDIR}"
          tar -cJf "${ROOTDIR}/build/qemu-${HOST_TRIPLET}.tar.xz" .
          cd "${ROOTDIR}/build"
          sha256sum qemu-${{ env.HOST_TRIPLET }}.tar.xz | tee qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256

          rm -rf "${DESTDIR}"

      - name: Upload QEMU artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.QEMU_TAG }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          files: |
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz
            build/qemu-${{ env.HOST_TRIPLET }}.tar.xz.sha256

  macos-universal:
    concurrency:
      group: ${{ github.workflow }}-macos-universal-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      cancel-in-progress: true
    needs: [setup, macos-x86_64, macos-aarch64]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-universal')
    runs-on: macos-15-intel
    env:
      XZ_OPT: "-e -T0 -9"
    name: macos-universal

    steps:
      - name: Create universal binaries for shared linked builds
        run: |
          export ROOTDIR="$(pwd)"
          export QEMU_VERSION="${QEMU_TAG#v}"

          mkdir -p universal
          cd universal
          
          curl -fSL "https://github.com/cocoa-xu/qemu-build/releases/download/v${QEMU_VERSION}/qemu-aarch64-apple-darwin.tar.xz" -o "qemu-aarch64-apple-darwin.tar.xz"
          mkdir -p qemu-aarch64-apple-darwin
          tar -xf qemu-aarch64-apple-darwin.tar.xz -C qemu-aarch64-apple-darwin --strip-components=3

          curl -fSL "https://github.com/cocoa-xu/qemu-build/releases/download/v${QEMU_VERSION}/qemu-x86_64-apple-darwin.tar.xz" -o "qemu-x86_64-apple-darwin.tar.xz"
          mkdir -p qemu-x86_64-apple-darwin
          tar -xf qemu-x86_64-apple-darwin.tar.xz -C qemu-x86_64-apple-darwin --strip-components=3

          find ./qemu-aarch64-apple-darwin/bin -perm +0111 -type f -exec bash -c 'export X86_64_DYLIB="$(echo {} | sed "s/qemu-aarch64-apple/qemu-x86_64-apple/")" && [ -f "${X86_64_DYLIB}" ] && lipo -create {} ${X86_64_DYLIB} -output {}' \;
          find ./qemu-aarch64-apple-darwin/lib -perm +0111 -type f -exec bash -c 'export X86_64_DYLIB="$(echo {} | sed "s/qemu-aarch64-apple/qemu-x86_64-apple/")" && [ -f "${X86_64_DYLIB}" ] && lipo -create {} ${X86_64_DYLIB} -output {}' \;
          find ./qemu-x86_64-apple-darwin/lib -type f -exec bash -c 'export AARCH64_DYLIB="$(echo {} | sed "s/qemu-x86_64-apple/qemu-aarch64-apple/")" && [ ! -f "${AARCH64_DYLIB}" ] && cp -f {} ./qemu-aarch64-apple-darwin/lib/' \;

          mkdir -p output/usr
          mv ./qemu-aarch64-apple-darwin ./output/usr/local
          
          cd output
          tar -cJf "${ROOTDIR}/qemu-macos-universal.tar.xz" .
          cd ${ROOTDIR}
          shasum -a 256 qemu-macos-universal.tar.xz | tee qemu-macos-universal.tar.xz.sha256

      - name: Upload QEMU artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.QEMU_TAG }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          files: |
            ./qemu-macos-universal.tar.xz
            ./qemu-macos-universal.tar.xz.sha256
